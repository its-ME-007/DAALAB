<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Agent - Attempy-DAA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e4e4e7;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .header {
            background: rgba(30, 30, 46, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .code-section, .chat-section {
            background: rgba(30, 30, 46, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .code-editor {
            width: 100%;
            height: 400px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            background: rgba(15, 23, 42, 0.7);
            color: #e2e8f0;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .code-editor:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .chat-box {
            height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.7);
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: white;
            margin-left: auto;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .message.agent {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(15, 23, 42, 0.7);
            color: #e4e4e7;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group input:focus {
            border-color: #8b5cf6;
            outline: 0;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 15px;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .code-editor, .chat-box {
                height: 300px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Home</a>
        
        <div class="header">
            <h1>🤖 AI Code Agent</h1>
            <p>Upload your code and chat with Codey, your AI assistant</p>
        </div>

        <div class="main-content">
            <div class="code-section">
                <div class="section-title">📝 Your Code</div>
                <textarea id="codeEditor" class="code-editor" placeholder="Paste your Python or C++ code here..."></textarea>
                
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="uploadCode()">📤 Upload Code</button>
                    <button class="btn btn-primary" onclick="analyzeCode()">🔍 Analyze</button>
                </div>
            </div>

            <div class="chat-section">
                <div class="section-title">💬 Chat with Agent</div>
                <div id="chatBox" class="chat-box">
                    <div class="message agent">
                        Hi! I'm Codey, your AI code assistant. Upload your code or ask me anything about algorithms and complexity!
                    </div>
                </div>
                
                <div class="input-group">
                    <input type="text" id="userInput" placeholder="Ask about time complexity, code issues, suggestions..." onkeypress="handleKeyPress(event)">
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        let sessionId = 'user_' + Date.now();

        function addMessage(text, isUser) {
            const chatBox = document.getElementById('chatBox');
            const message = document.createElement('div');
            message.className = `message ${isUser ? 'user' : 'agent'}`;
            message.textContent = text;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addLoadingMessage() {
            const chatBox = document.getElementById('chatBox');
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.id = 'loading';
            loading.textContent = '🤔 Thinking...';
            chatBox.appendChild(loading);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoadingMessage() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }

        async function uploadCode() {
            const code = document.getElementById('codeEditor').value;
            if (!code.trim()) {
                alert('Please enter some code first!');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        filename: 'code.py'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    addMessage('✅ Code uploaded successfully!', false);
                } else {
                    addMessage('❌ Upload failed: ' + data.message, false);
                }
            } catch (error) {
                addMessage('❌ Error: ' + error.message, false);
            }
        }

        async function analyzeCode() {
            const code = document.getElementById('codeEditor').value;
            if (!code.trim()) {
                alert('Please enter some code first!');
                return;
            }

            addMessage('Analyze this code', true);
            addLoadingMessage();

            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        language: 'python',
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                removeLoadingMessage();

                if (data.success) {
                    addMessage(data.response, false);
                } else {
                    addMessage('❌ Error: ' + (data.error || 'Analysis failed'), false);
                }
            } catch (error) {
                removeLoadingMessage();
                addMessage('❌ Error: ' + error.message, false);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const question = input.value.trim();

            if (!question) return;

            addMessage(question, true);
            input.value = '';
            addLoadingMessage();

            const code = document.getElementById('codeEditor').value;

            try {
                const response = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        code: code || null,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                removeLoadingMessage();

                if (data.success) {
                    addMessage(data.response, false);
                } else {
                    addMessage('❌ Error: ' + (data.error || 'Request failed'), false);
                }
            } catch (error) {
                removeLoadingMessage();
                addMessage('❌ Error: ' + error.message, false);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
